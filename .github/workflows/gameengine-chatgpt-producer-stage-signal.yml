name: GameEngine ChatGPT Producer Stage Signal

run-name: >-
  ChatGPT connector producer ready ${{ github.sha }}

on:
  push:
    branches:
      - "chatgpt-producer-stage-*"
    paths:
      - ".chatgpt-producer/**/ready.json"

permissions:
  contents: read

concurrency:
  group: gameengine-chatgpt-producer-stage-signal-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  signal:
    name: Validate connector producer ready marker
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out producer ready commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Validate producer ready marker shape
        shell: bash
        env:
          EXPECTED_REPOSITORY: KdGithubIt/GameEngine
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$1"
            exit 1
          }

          [[ "$GITHUB_REPOSITORY" == "$EXPECTED_REPOSITORY" ]] ||
            fail "This workflow is restricted to $EXPECTED_REPOSITORY."
          [[ "$GITHUB_REF_NAME" =~ ^chatgpt-producer-stage-([A-Za-z0-9][A-Za-z0-9._-]{0,63})$ ]] ||
            fail "This signal is restricted to chatgpt-producer-stage-<request-id>."
          request_id="${BASH_REMATCH[1]}"
          [[ "$GITHUB_SHA" =~ ^[0-9a-fA-F]{40}$ ]] ||
            fail "The producer ready commit must be a full commit SHA."

          mapfile -d '' changed_paths < <(
            git diff-tree --no-commit-id --name-only -r -z "$GITHUB_SHA"
          )
          ready_path=".chatgpt-producer/$request_id/ready.json"
          [[ ${#changed_paths[@]} -eq 1 && "${changed_paths[0]}" == "$ready_path" ]] ||
            fail "The producer ready commit must change exactly $ready_path."

          change_status="$(git diff-tree --no-commit-id --name-status -r "$GITHUB_SHA")"
          [[ "$change_status" == $'A\t'"$ready_path" ]] ||
            fail "Producer ready.json must be newly added in the final producer commit."

          ready_mode="$(git ls-tree "$GITHUB_SHA" -- "$ready_path" | awk '{print $1}')"
          [[ "$ready_mode" == "100644" ]] ||
            fail "Producer ready.json must be a normal non-executable file."

          manifest="$RUNNER_TEMP/chatgpt-producer-ready.json"
          git show "$GITHUB_SHA:$ready_path" > "$manifest"
          jq -e . "$manifest" >/dev/null || fail "Producer ready.json is not valid JSON."
          [[ "$(jq -r '.schema_version // empty' "$manifest")" == "1" ]] ||
            fail "Producer ready.json schema_version must be 1."
          [[ "$(jq -r '.request_id // empty' "$manifest")" == "$request_id" ]] ||
            fail "Producer ready.json request_id must match the producer branch."

          {
            echo "### ChatGPT connector producer signal accepted"
            echo
            echo "- Producer branch: \`$GITHUB_REF_NAME\`"
            echo "- Ready commit: \`$GITHUB_SHA\`"
            echo "- Ready marker: \`$ready_path\`"
            echo "- Mutation permissions: none"
          } >> "$GITHUB_STEP_SUMMARY"
