name: GameEngine ChatGPT Transport Stage Signal

run-name: >-
  ChatGPT staged request ready ${{ github.sha }}

on:
  push:
    branches:
      - "chatgpt-dispatch-stage-*"
    paths:
      - ".chatgpt-requests/**/ready.json"

permissions:
  contents: read

concurrency:
  group: gameengine-chatgpt-stage-signal-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  signal:
    name: Validate staged ready marker signal
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the staged request commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Validate staged ready marker shape
        shell: bash
        env:
          EXPECTED_REPOSITORY: KdGithubIt/GameEngine
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$1"
            exit 1
          }

          [[ "$GITHUB_REPOSITORY" == "$EXPECTED_REPOSITORY" ]] ||
            fail "This workflow is restricted to $EXPECTED_REPOSITORY."
          [[ "$GITHUB_REF_NAME" =~ ^chatgpt-dispatch-stage-([A-Za-z0-9][A-Za-z0-9._-]{0,63})$ ]] ||
            fail "This signal is restricted to chatgpt-dispatch-stage-<request-id>."
          request_id="${BASH_REMATCH[1]}"

          [[ "$GITHUB_SHA" =~ ^[0-9a-fA-F]{40}$ ]] ||
            fail "The staged request head must be a full commit SHA."

          mapfile -d '' changed_paths < <(
            git diff-tree --no-commit-id --name-only -r -z "$GITHUB_SHA"
          )
          [[ ${#changed_paths[@]} -eq 1 ]] ||
            fail "The staged ready commit must change exactly one file."

          ready_path="${changed_paths[0]}"
          expected_ready_path=".chatgpt-requests/$request_id/ready.json"
          [[ "$ready_path" == "$expected_ready_path" ]] ||
            fail "The staged ready commit must add $expected_ready_path."

          change_status="$(git diff-tree --no-commit-id --name-status -r "$GITHUB_SHA")"
          [[ "$change_status" == $'A\t'"$ready_path" ]] ||
            fail "ready.json must be newly added in the final staged commit."

          ready_mode="$(git ls-tree "$GITHUB_SHA" -- "$ready_path" | awk '{print $1}')"
          [[ "$ready_mode" == "100644" ]] ||
            fail "ready.json must be a normal non-executable file."

          manifest="$RUNNER_TEMP/chatgpt-stage-ready.json"
          git show "$GITHUB_SHA:$ready_path" > "$manifest"
          jq -e . "$manifest" >/dev/null || fail "ready.json is not valid JSON."
          [[ "$(jq -r '.request_id // empty' "$manifest")" == "$request_id" ]] ||
            fail "ready.json request_id must match the staging branch."

          {
            echo "### ChatGPT staged request signal accepted"
            echo
            echo "- Stage branch: \`$GITHUB_REF_NAME\`"
            echo "- Stage commit: \`$GITHUB_SHA\`"
            echo "- Ready marker: \`$ready_path\`"
            echo "- Mutation permissions: none"
          } >> "$GITHUB_STEP_SUMMARY"
