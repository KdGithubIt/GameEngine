name: Bootstrap Public Migration

on:
  push:
    branches:
      - chatgpt/gameengine-public-bootstrap
    paths:
      - .github/workflows/bootstrap-public-migration.yml

permissions:
  contents: write

concurrency:
  group: gameengine-public-bootstrap
  cancel-in-progress: false

jobs:
  migrate:
    if: github.repository == 'KdGithubIt/GameEngine'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_REPOSITORY: KdGithubIt/RustProject
      SOURCE_SHA: 68e136f9a06b52f6e024b4f895f7db5c8510ad00
      TARGET_BRANCH: chatgpt/gameengine-public-bootstrap
    steps:
      - name: Validate migration credential
        shell: bash
        env:
          MIGRATION_TOKEN: ${{ secrets.MIGRATION_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${MIGRATION_TOKEN}" || {
            echo 'MIGRATION_TOKEN is not configured.' >&2
            exit 1
          }

      - name: Fetch exact public bootstrap state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init --quiet destination
          git -C destination remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C destination fetch --quiet --depth=1 origin "${GITHUB_SHA}"
          git -C destination checkout --quiet --detach FETCH_HEAD
          test "$(git -C destination rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Fetch audited private source snapshot
        shell: bash
        env:
          MIGRATION_TOKEN: ${{ secrets.MIGRATION_TOKEN }}
        run: |
          set -euo pipefail
          git init --quiet source
          git -C source remote add origin "https://x-access-token:${MIGRATION_TOKEN}@github.com/${SOURCE_REPOSITORY}.git"
          git -C source fetch --quiet --depth=1 origin "${SOURCE_SHA}"
          git -C source checkout --quiet --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "${SOURCE_SHA}"
          git -C source remote remove origin

      - name: Apply reviewed standalone migration patch
        shell: bash
        run: |
          set -euo pipefail
          cat destination/.bootstrap/migration.patch.gz.b64.part-* \
            | base64 --decode \
            | gzip --decompress \
            > migration.patch
          git -C source apply --check --whitespace=error-all "${GITHUB_WORKSPACE}/migration.patch"
          git -C source apply --whitespace=error-all "${GITHUB_WORKSPACE}/migration.patch"
          git -C source diff --check

      - name: Build allow-listed public snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir public-snapshot
          rsync -a \
            --exclude='.codex_tmp/' \
            --exclude='.codex-task-*' \
            --exclude='.idea/' \
            --exclude='.vscode/' \
            --exclude='target/' \
            --exclude='build_errors.txt' \
            --exclude='crates.zip' \
            --exclude='docs.zip' \
            --exclude='docs/*.pptx' \
            --exclude='docs/*.docx' \
            --exclude='GameEngine-ChatGPT-Apply/' \
            --exclude='examples/*/.engine/asset_trash/' \
            --exclude='examples/*/.engine/imported/' \
            source/GameEngine/ public-snapshot/
          rm -f \
            public-snapshot/.github/workflows/gameengine-chatgpt-auto-merge.yml \
            public-snapshot/.github/workflows/gameengine-chatgpt-bridge.yml

      - name: Audit public snapshot boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path('public-snapshot')
          forbidden_parts = {'.codex_tmp', '.idea', '.vscode', 'target', 'GameEngine-ChatGPT-Apply'}
          forbidden_names = {'build_errors.txt', 'crates.zip', 'docs.zip'}
          forbidden_suffixes = {
              '.7z', '.blend', '.bmp', '.dll', '.docx', '.exe', '.fbx', '.flac',
              '.gif', '.glb', '.ico', '.jpeg', '.jpg', '.ktx', '.ktx2', '.mp3',
              '.obj', '.otf', '.pdf', '.pdb', '.pmd', '.pmx', '.png', '.pptx',
              '.rar', '.ttf', '.vmd', '.wav', '.webp', '.zip',
          }
          allowed_asset_paths = {
              'crates/editor/tests/fixtures/skinned_motion.gltf',
          }
          secret_patterns = {
              'GitHub token': re.compile(r'(?<![A-Za-z0-9_])(?:github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{20,})'),
              'AWS access key': re.compile(r'(?<![A-Z0-9])AKIA[0-9A-Z]{16}(?![A-Z0-9])'),
              'private key': re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              'OpenAI-style secret': re.compile(r'(?<![A-Za-z0-9])sk-[A-Za-z0-9_-]{20,}'),
              'Windows user path': re.compile(r'(?i)[A-Z]:\\\\Users\\\\[^\\\\\s]+\\\\'),
              'macOS user path': re.compile(r'/Users/[^/\s]+/'),
          }

          findings = []
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              rel = path.relative_to(root).as_posix()
              parts = set(path.relative_to(root).parts)
              if parts & forbidden_parts or path.name in forbidden_names or path.name.startswith('.codex-task-'):
                  findings.append(f'forbidden path: {rel}')
              suffix = path.suffix.lower()
              if suffix == '.gltf' and rel not in allowed_asset_paths:
                  findings.append(f'unreviewed asset: {rel}')
              elif suffix in forbidden_suffixes:
                  findings.append(f'forbidden binary/asset: {rel}')
              if path.stat().st_size > 2_000_000:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for label, pattern in secret_patterns.items():
                  if pattern.search(text):
                      findings.append(f'{label}: {rel}')

          if findings:
              print('Public snapshot audit failed:', file=sys.stderr)
              for finding in sorted(set(findings)):
                  print(f'  - {finding}', file=sys.stderr)
              sys.exit(1)

          required = ['Cargo.toml', 'Cargo.lock', 'AGENTS.md', 'crates', 'docs', 'scripts']
          missing = [item for item in required if not (root / item).exists()]
          if missing:
              print(f'Missing required public paths: {missing}', file=sys.stderr)
              sys.exit(1)

          print('Public snapshot audit passed.')
          PY

      - name: Replace bootstrap tree with audited snapshot
        shell: bash
        run: |
          set -euo pipefail
          find destination -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a public-snapshot/. destination/
          git -C destination diff --check
          echo 'Snapshot status:'
          git -C destination status --short

      - name: Commit and push audited snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -C destination config user.name 'github-actions[bot]'
          git -C destination config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C destination add -A
          git -C destination diff --cached --check
          git -C destination commit -m 'Bootstrap audited standalone GameEngine snapshot'
          git -C destination push origin "HEAD:refs/heads/${TARGET_BRANCH}"
