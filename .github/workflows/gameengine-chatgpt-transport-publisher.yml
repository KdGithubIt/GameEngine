name: GameEngine ChatGPT Transport Publisher

run-name: >-
  Publish staged ChatGPT request ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.stage_branch || github.event.workflow_run.head_branch }}

on:
  workflow_run:
    workflows:
      - GameEngine ChatGPT Transport Stage Signal
    types:
      - completed
    branches:
      - "chatgpt-dispatch-stage-*"
  workflow_dispatch:
    inputs:
      stage_branch:
        description: Immutable chatgpt-dispatch-stage-<request-id> branch
        required: true
        type: string
      request_commit:
        description: Full ready commit SHA at the immutable stage branch head
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: gameengine-chatgpt-transport-publisher
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    name: Serialize staged request onto chatgpt-dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out transport branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: chatgpt-dispatch
          fetch-depth: 0

      - name: Validate and publish staged request
        id: publish
        shell: bash
        env:
          EXPECTED_REPOSITORY: KdGithubIt/GameEngine
          SIGNAL_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SIGNAL_EVENT: ${{ github.event.workflow_run.event }}
          SIGNAL_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          STAGE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.stage_branch || github.event.workflow_run.head_branch }}
          REQUEST_COMMIT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.request_commit || github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$1"
            exit 1
          }

          [[ "$GITHUB_REPOSITORY" == "$EXPECTED_REPOSITORY" ]] ||
            fail "This workflow is restricted to $EXPECTED_REPOSITORY."
          [[ "$GITHUB_REF_NAME" == "main" ]] ||
            fail "The write-capable transport publisher must run from main."

          case "$GITHUB_EVENT_NAME" in
            workflow_run)
              [[ "$SIGNAL_CONCLUSION" == "success" ]] ||
                fail "The read-only stage signal did not complete successfully."
              [[ "$SIGNAL_EVENT" == "push" ]] ||
                fail "The stage signal must originate from a push event."
              [[ "$SIGNAL_REPOSITORY" == "$EXPECTED_REPOSITORY" ]] ||
                fail "The stage signal must originate from this repository."
              ;;
            workflow_dispatch)
              [[ "${{ github.event.inputs.stage_branch }}" == "$STAGE_BRANCH" ]] ||
                fail "workflow_dispatch must provide stage_branch explicitly."
              [[ "${{ github.event.inputs.request_commit }}" == "$REQUEST_COMMIT" ]] ||
                fail "workflow_dispatch must provide request_commit explicitly."
              ;;
            *)
              fail "Unsupported publisher event: $GITHUB_EVENT_NAME"
              ;;
          esac

          [[ "$STAGE_BRANCH" =~ ^chatgpt-dispatch-stage-([A-Za-z0-9][A-Za-z0-9._-]{0,63})$ ]] ||
            fail "The stage branch must be chatgpt-dispatch-stage-<request-id>."
          request_id="${BASH_REMATCH[1]}"
          [[ "$REQUEST_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]] ||
            fail "The stage ready commit must be a full SHA."

          git fetch --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/chatgpt-dispatch:refs/remotes/origin/chatgpt-dispatch" \
            "refs/heads/$STAGE_BRANCH:refs/remotes/origin/$STAGE_BRANCH"
          stage_head="$(git rev-parse "refs/remotes/origin/$STAGE_BRANCH")"
          [[ "$stage_head" == "$REQUEST_COMMIT" ]] ||
            fail "The stage branch moved after the ready signal. Publish a new immutable stage branch."

          main_head="$(git rev-parse refs/remotes/origin/main)"
          transport_head="$(git rev-parse refs/remotes/origin/chatgpt-dispatch)"
          stage_base="$(git merge-base "$REQUEST_COMMIT" "$main_head")"
          [[ -n "$stage_base" && "$stage_base" != "$REQUEST_COMMIT" ]] ||
            fail "The stage branch must contain request commits on top of main history."
          git merge-base --is-ancestor "$stage_base" "$main_head" ||
            fail "The stage branch base is not reachable from main."

          mapfile -t request_commits < <(
            git rev-list --reverse "$stage_base..$REQUEST_COMMIT"
          )
          [[ ${#request_commits[@]} -ge 2 && ${#request_commits[@]} -le 65 ]] ||
            fail "The stage branch must contain 1 to 64 payload commits/parts followed by one ready commit."
          [[ "${request_commits[-1]}" == "$REQUEST_COMMIT" ]] ||
            fail "The ready commit must be the final staged request commit."

          request_dir=".chatgpt-requests/$request_id"
          ready_path="$request_dir/ready.json"
          last_index=$((${#request_commits[@]} - 1))

          for ((index = 0; index <= last_index; index += 1)); do
            commit_sha="${request_commits[$index]}"
            parent_count="$(git rev-list --parents -n 1 "$commit_sha" | awk '{print NF - 1}')"
            [[ "$parent_count" -eq 1 ]] ||
              fail "Staged request commits must be linear non-merge commits."

            mapfile -d '' changed_paths < <(
              git diff-tree --no-commit-id --name-only -r -z "$commit_sha"
            )
            [[ ${#changed_paths[@]} -ge 1 ]] ||
              fail "A staged request commit contains no file changes."

            if [[ "$index" -eq "$last_index" ]]; then
              [[ ${#changed_paths[@]} -eq 1 && "${changed_paths[0]}" == "$ready_path" ]] ||
                fail "The final staged commit must change only $ready_path."
              change_status="$(git diff-tree --no-commit-id --name-status -r "$commit_sha")"
              [[ "$change_status" == $'A\t'"$ready_path" ]] ||
                fail "ready.json must be newly added in the final staged commit."
            else
              while IFS= read -r -d '' status && IFS= read -r -d '' changed_path; do
                [[ "$status" == "A" ]] ||
                  fail "Payload commits may only add immutable patch part files."
                [[ "$changed_path" =~ ^${request_dir//./\.}/part-[0-9]{4}\.patch$ ]] ||
                  fail "Payload commits may only add part-NNNN.patch files for this request."
              done < <(git diff-tree --no-commit-id --name-status -r -z "$commit_sha")
            fi
          done

          ready_mode="$(git ls-tree "$REQUEST_COMMIT" -- "$ready_path" | awk '{print $1}')"
          [[ "$ready_mode" == "100644" ]] ||
            fail "ready.json must be a normal non-executable file."

          manifest="$RUNNER_TEMP/chatgpt-stage-ready.json"
          git show "$REQUEST_COMMIT:$ready_path" > "$manifest"
          jq -e . "$manifest" >/dev/null || fail "ready.json is not valid JSON."
          [[ "$(jq -r '.request_id // empty' "$manifest")" == "$request_id" ]] ||
            fail "ready.json request_id must match the stage branch."

          mapfile -t stage_files < <(
            git ls-tree -r --name-only "$REQUEST_COMMIT" -- "$request_dir" |
              sed -n "s#^$request_dir/##p" |
              sort
          )
          [[ ${#stage_files[@]} -ge 2 && ${#stage_files[@]} -le 65 ]] ||
            fail "The staged request directory must contain 1 to 64 patch parts plus ready.json."
          [[ "${stage_files[-1]}" == "ready.json" ]] ||
            fail "The staged request directory contains an unexpected file."

          part_count=$((${#stage_files[@]} - 1))
          total_bytes=0
          for ((index = 0; index < part_count; index += 1)); do
            printf -v expected_name 'part-%04d.patch' "$index"
            [[ "${stage_files[$index]}" == "$expected_name" ]] ||
              fail "Patch parts must be contiguous part-NNNN.patch files."
            part_path="$request_dir/$expected_name"
            part_mode="$(git ls-tree "$REQUEST_COMMIT" -- "$part_path" | awk '{print $1}')"
            [[ "$part_mode" == "100644" ]] ||
              fail "$expected_name must be a normal non-executable file."
            part_bytes="$(git cat-file -s "$REQUEST_COMMIT:$part_path" 2>/dev/null || true)"
            [[ "$part_bytes" =~ ^[0-9]+$ && "$part_bytes" -gt 0 && "$part_bytes" -le 60000 ]] ||
              fail "$expected_name must contain 1 to 60000 bytes."
            total_bytes=$((total_bytes + part_bytes))
          done
          [[ "$total_bytes" -le 4194304 ]] ||
            fail "The reconstructed patch may not exceed 4 MiB."

          stage_tree="$(git rev-parse "$REQUEST_COMMIT:$request_dir")"
          existing_tree="$(git rev-parse --verify "$transport_head:$request_dir" 2>/dev/null || true)"

          if [[ -n "$existing_tree" ]]; then
            [[ "$existing_tree" == "$stage_tree" ]] ||
              fail "The request ID already exists on chatgpt-dispatch with different content."
            published_head="$(git log -1 --format=%H "$transport_head" -- "$ready_path")"
            [[ "$published_head" =~ ^[0-9a-fA-F]{40}$ ]] ||
              fail "The already-published request ready commit could not be resolved."
            already_published=true
          else
            git reset --hard "$transport_head"
            git config user.name "ChatGPT GameEngine Transport Publisher"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            for commit_sha in "${request_commits[@]}"; do
              git cherry-pick "$commit_sha"
            done
            published_head="$(git rev-parse HEAD)"
            already_published=false

            remote_transport_head="$(git ls-remote origin refs/heads/chatgpt-dispatch | awk '{print $1}')"
            [[ "$remote_transport_head" == "$transport_head" ]] ||
              fail "chatgpt-dispatch moved outside the serialized publisher. Refusing a stale publish."

            git push \
              --force-with-lease="refs/heads/chatgpt-dispatch:$transport_head" \
              origin HEAD:refs/heads/chatgpt-dispatch
          fi

          {
            echo "published_head=$published_head"
            echo "request_id=$request_id"
            echo "stage_branch=$STAGE_BRANCH"
            echo "already_published=$already_published"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch trusted request processor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_HEAD: ${{ steps.publish.outputs.published_head }}
        run: |
          set -euo pipefail
          gh workflow run gameengine-chatgpt-dispatcher.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f request_commit="$PUBLISHED_HEAD"

      - name: Summarize transport publication
        shell: bash
        env:
          REQUEST_ID: ${{ steps.publish.outputs.request_id }}
          STAGE_BRANCH: ${{ steps.publish.outputs.stage_branch }}
          PUBLISHED_HEAD: ${{ steps.publish.outputs.published_head }}
          ALREADY_PUBLISHED: ${{ steps.publish.outputs.already_published }}
        run: |
          {
            echo "### ChatGPT request serialized onto transport"
            echo
            echo "- Request: \`$REQUEST_ID\`"
            echo "- Stage branch: \`$STAGE_BRANCH\`"
            echo "- Transport ready commit: \`$PUBLISHED_HEAD\`"
            echo "- Already present: \`$ALREADY_PUBLISHED\`"
            echo "- Direct producer writes to chatgpt-dispatch: not used"
          } >> "$GITHUB_STEP_SUMMARY"
