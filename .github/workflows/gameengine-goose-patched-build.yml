name: GameEngine Patched Goose Build

on:
  pull_request:
    paths:
      - "automation/goose-patched/**"
      - ".github/workflows/gameengine-goose-patched-build.yml"
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified ZIP and provenance as a new immutable GameEngine Goose release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: gameengine-goose-patched-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Verify, test, and build patched Goose
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      SOURCE_ROOT: automation/goose-patched
      GOOSE_ROOT: upstream-goose
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"

    steps:
      - name: Check out exact GameEngine revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate static provenance
        id: source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $provenance = Get-Content "$env:SOURCE_ROOT/provenance.json" -Raw | ConvertFrom-Json
          if ($provenance.schema_version -ne 1) { throw "Unsupported provenance schema" }
          if ($provenance.upstream_repository -ne "https://github.com/aaif-goose/goose") { throw "Unexpected upstream repository" }
          if ($provenance.upstream_tag -ne "v1.45.0") { throw "Unexpected upstream tag" }
          if ($provenance.upstream_sha -notmatch '^[0-9a-f]{40}$') { throw "upstream_sha must be a full SHA" }
          if ($provenance.runtime_identity -ne "1.45.0-gameengine-p1") { throw "Unexpected runtime identity" }
          if ($provenance.patch_revision -ne "gameengine-p1") { throw "Unexpected patch revision" }
          $expected = 1
          foreach ($patch in $provenance.patches) {
            if ($patch.order -ne $expected) { throw "Patch order must be contiguous" }
            $patchPath = Join-Path $env:SOURCE_ROOT $patch.path
            if (-not (Test-Path $patchPath -PathType Leaf)) { throw "Missing patch: $patchPath" }
            $expected++
          }
          "upstream_sha=$($provenance.upstream_sha)" >> $env:GITHUB_OUTPUT
          "upstream_tag=$($provenance.upstream_tag)" >> $env:GITHUB_OUTPUT
          "runtime_identity=$($provenance.runtime_identity)" >> $env:GITHUB_OUTPUT
          "patch_revision=$($provenance.patch_revision)" >> $env:GITHUB_OUTPUT

      - name: Fetch exact upstream Goose revision
        shell: pwsh
        env:
          UPSTREAM_SHA: ${{ steps.source.outputs.upstream_sha }}
          UPSTREAM_TAG: ${{ steps.source.outputs.upstream_tag }}
        run: |
          $ErrorActionPreference = "Stop"
          git init $env:GOOSE_ROOT
          git -C $env:GOOSE_ROOT remote add origin https://github.com/aaif-goose/goose.git
          git -C $env:GOOSE_ROOT fetch --no-tags --depth=1 origin $env:UPSTREAM_SHA
          git -C $env:GOOSE_ROOT checkout --detach FETCH_HEAD
          $observed = (git -C $env:GOOSE_ROOT rev-parse HEAD).Trim().ToLowerInvariant()
          if ($observed -ne $env:UPSTREAM_SHA) { throw "Fetched $observed, expected $env:UPSTREAM_SHA" }
          git -C $env:GOOSE_ROOT fetch --no-tags --depth=1 origin "refs/tags/$env:UPSTREAM_TAG:refs/tags/$env:UPSTREAM_TAG"
          $tagged = (git -C $env:GOOSE_ROOT rev-parse "$env:UPSTREAM_TAG^{commit}").Trim().ToLowerInvariant()
          if ($tagged -ne $env:UPSTREAM_SHA) { throw "Tag $env:UPSTREAM_TAG resolves to $tagged, expected $env:UPSTREAM_SHA" }

      - name: Apply GameEngine patch series with strict preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $allowed = @(
            "crates/goose-providers/src/http_status.rs",
            "crates/goose-provider-types/src/base.rs",
            "crates/goose/src/context_mgmt/mod.rs",
            "crates/goose/src/agents/agent.rs",
            "crates/goose-cli/src/cli.rs"
          )
          $patches = Get-ChildItem "$env:SOURCE_ROOT/patches/*.patch" | Sort-Object Name
          if ($patches.Count -ne 5) { throw "Expected exactly five ordered patch files" }
          foreach ($patch in $patches) {
            Write-Host "Preflighting $($patch.Name)"
            git -C $env:GOOSE_ROOT apply --check --whitespace=error-all $patch.FullName
            if ($LASTEXITCODE -ne 0) { throw "Patch preflight failed: $($patch.Name)" }
            git -C $env:GOOSE_ROOT apply --whitespace=error-all $patch.FullName
            if ($LASTEXITCODE -ne 0) { throw "Patch apply failed: $($patch.Name)" }
          }
          git -C $env:GOOSE_ROOT diff --check
          if ($LASTEXITCODE -ne 0) { throw "Patched Goose contains whitespace errors" }
          $changed = @(git -C $env:GOOSE_ROOT diff --name-only)
          foreach ($path in $changed) {
            if ($allowed -notcontains $path) { throw "Patch series changed forbidden path: $path" }
          }
          if ($changed.Count -ne $allowed.Count) {
            Write-Host "Changed paths: $($changed -join ', ')"
          }

      - name: Show Rust toolchain
        working-directory: upstream-goose
        shell: pwsh
        run: |
          rustup show
          rustc --version
          cargo --version

      - name: Check formatting
        working-directory: upstream-goose
        run: cargo fmt --all --check

      - name: Check patched crates
        working-directory: upstream-goose
        run: cargo check -p goose-provider-types -p goose-providers -p goose -p goose-cli

      - name: Clippy patched crates
        working-directory: upstream-goose
        run: cargo clippy -p goose-provider-types -p goose-providers -p goose -p goose-cli --all-targets -- -D warnings

      - name: Test streamed output-limit propagation
        working-directory: upstream-goose
        run: cargo test -p goose-provider-types collect_stream_keeps_output_token_limit_flag_from_a_later_chunk

      - name: Test structured context overflow classification
        working-directory: upstream-goose
        run: cargo test -p goose-providers structured_context_overflow_is_not_a_generic_retryable_bad_request

      - name: Test mid-turn safe boundary
        working-directory: upstream-goose
        run: cargo test -p goose mid_turn_compaction_boundary_requires_a_completed_tool_result

      - name: Test mid-turn compaction invariants
        working-directory: upstream-goose
        run: cargo test -p goose mid_turn_compaction_preserves_tool_pairs_and_reduces_provider_context

      - name: Test truncated summary recovery
        working-directory: upstream-goose
        run: cargo test -p goose truncated_compaction_summary_is_retried_before_it_is_adopted

      - name: Run upstream compaction integration tests
        working-directory: upstream-goose
        run: cargo test -p goose --test compaction

      - name: Build Windows goose.exe
        working-directory: upstream-goose
        run: cargo build --release -p goose-cli --bin goose --no-default-features --features portable-default

      - name: Verify patched runtime identity and ACP entry point
        shell: pwsh
        env:
          RUNTIME_IDENTITY: ${{ steps.source.outputs.runtime_identity }}
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path $env:GOOSE_ROOT "target/release/goose.exe"
          if (-not (Test-Path $exe -PathType Leaf)) { throw "goose.exe was not produced" }
          $version = (& $exe --version | Out-String).Trim()
          Write-Host $version
          if ($version -notmatch [regex]::Escape($env:RUNTIME_IDENTITY)) {
            throw "Patched runtime identity missing from --version: $version"
          }
          & $exe acp --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "goose acp --help failed" }

      - name: Package ZIP and build provenance
        id: package
        shell: pwsh
        env:
          UPSTREAM_SHA: ${{ steps.source.outputs.upstream_sha }}
          UPSTREAM_TAG: ${{ steps.source.outputs.upstream_tag }}
          RUNTIME_IDENTITY: ${{ steps.source.outputs.runtime_identity }}
          PATCH_REVISION: ${{ steps.source.outputs.patch_revision }}
        run: |
          $ErrorActionPreference = "Stop"
          $output = Join-Path $pwd "goose-patched-output"
          $package = Join-Path $output "package"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item "$env:GOOSE_ROOT/target/release/goose.exe" "$package/goose.exe"
          Copy-Item "$env:SOURCE_ROOT/provenance.json" "$package/SOURCE_PROVENANCE.json"
          $fixedTime = [DateTime]::SpecifyKind([DateTime]::Parse("2026-07-29T17:28:29Z"), [DateTimeKind]::Utc)
          Get-ChildItem $package | ForEach-Object { $_.LastWriteTimeUtc = $fixedTime }
          $zipName = "goose-$env:RUNTIME_IDENTITY-x86_64-pc-windows-msvc.zip"
          $zipPath = Join-Path $output $zipName
          Compress-Archive -Path "$package/*" -DestinationPath $zipPath -CompressionLevel Optimal
          $exeSha = (Get-FileHash "$package/goose.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipSha = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $runUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $buildProvenance = [ordered]@{
            schema_version = 1
            upstream_repository = "https://github.com/aaif-goose/goose"
            upstream_tag = $env:UPSTREAM_TAG
            upstream_sha = $env:UPSTREAM_SHA
            gameengine_repository = "https://github.com/${{ github.repository }}"
            gameengine_revision = "${{ github.sha }}"
            patch_revision = $env:PATCH_REVISION
            runtime_identity = $env:RUNTIME_IDENTITY
            workflow_run = $runUrl
            workflow_run_id = "${{ github.run_id }}"
            workflow_run_attempt = "${{ github.run_attempt }}"
            artifact_name = "gameengine-goose-$env:RUNTIME_IDENTITY-windows"
            zip_name = $zipName
            zip_sha256 = $zipSha
            executable_name = "goose.exe"
            executable_sha256 = $exeSha
          }
          $buildProvenance | ConvertTo-Json -Depth 5 | Set-Content "$output/BUILD_PROVENANCE.json" -Encoding utf8
          "$zipSha  $zipName" | Set-Content "$output/SHA256SUMS.txt" -Encoding ascii
          "$exeSha  goose.exe" | Add-Content "$output/SHA256SUMS.txt" -Encoding ascii
          "zip_name=$zipName" >> $env:GITHUB_OUTPUT
          "zip_sha256=$zipSha" >> $env:GITHUB_OUTPUT
          "exe_sha256=$exeSha" >> $env:GITHUB_OUTPUT
          Get-Content "$output/BUILD_PROVENANCE.json"

      - name: Upload verified patched Goose artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gameengine-goose-${{ steps.source.outputs.runtime_identity }}-windows
          path: goose-patched-output/
          if-no-files-found: error
          retention-days: 30

      - name: Write build summary
        shell: pwsh
        run: |
          @"
          ## Patched Goose build
          - upstream: `${{ steps.source.outputs.upstream_tag }}` / `${{ steps.source.outputs.upstream_sha }}`
          - patch revision: `${{ steps.source.outputs.patch_revision }}`
          - runtime identity: `${{ steps.source.outputs.runtime_identity }}`
          - ZIP SHA-256: `${{ steps.package.outputs.zip_sha256 }}`
          - goose.exe SHA-256: `${{ steps.package.outputs.exe_sha256 }}`
          "@ >> $env:GITHUB_STEP_SUMMARY

  publish-release:
    name: Publish immutable patched Goose release
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
    needs: build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Require main
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main" || { echo "Release publishing is restricted to main" >&2; exit 1; }

      - name: Download verified artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gameengine-goose-1.45.0-gameengine-p1-windows
          path: release-assets

      - name: Publish without overwrite
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: goose-gameengine-v1.45.0-p1-4dc0420
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing tag ${TAG}" >&2
            exit 1
          fi
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release ${TAG}" >&2
            exit 1
          fi
          gh release create "${TAG}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "GameEngine patched Goose 1.45.0-gameengine-p1" \
            --notes "Temporary GameEngine-managed Goose ACP build from upstream v1.45.0 (4dc0420f5704a92806c6628c8f0a3497d7a88759) plus patch revision gameengine-p1. See BUILD_PROVENANCE.json for exact hashes and workflow identity."
