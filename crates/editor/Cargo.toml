[package]
name = "engine-editor"
version = "0.1.0"
edition = "2024"
default-run = "engine-editor"
autobins = false

[[bin]]
name = "engine-editor"
path = "src/main.rs"

[dependencies]
dirs = "5"
eframe = "0.34.3"
engine = { path = "../engine" }
engine-authoring = { path = "../authoring" }
engine-project-lifecycle = { path = "../project-lifecycle" }
pollster = "0.3"
png = "0.18"
open = "5"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
