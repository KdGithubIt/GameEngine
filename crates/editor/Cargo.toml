[package]
name = "engine-editor"
version = "0.1.0"
edition = "2024"
default-run = "engine-editor"
autobins = false

[features]
visual-validation = []

[[bin]]
name = "engine-editor"
path = "src/main.rs"

[dependencies]
agent-client-protocol = "2.0.0"
dirs = "5"
eframe = "0.34.3"
engine = { path = "../engine" }
engine-assets = { path = "../assets" }
engine-authoring = { path = "../authoring" }
engine-timeline = { path = "../timeline" }
engine-mcp = { path = "../mcp" }
engine-project-lifecycle = { path = "../project-lifecycle" }
futures = "0.3"
getrandom = "0.3"
pollster = "0.3"
png = "0.18"
open = "5"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
engine-cli = { path = "../cli" }
tempfile = "3"
