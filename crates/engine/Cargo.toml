[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[dependencies]
engine-animation = { path = "../animation" }
engine-authoring = { path = "../authoring" }
engine-assets = { path = "../assets" }
engine-core = { path = "../core" }
engine-ecs = { path = "../ecs" }
engine-gameplay = { path = "../gameplay" }
engine-import = { path = "../import", default-features = false }
engine-physics = { path = "../physics" }
engine-platform = { path = "../platform" }
engine-render-runtime = { path = "../render-runtime" }
engine-rig = { path = "../rig" }
engine-scene = { path = "../scene" }
engine-scripting = { path = "../scripting" }
engine-renderer = { path = "../renderer" }
engine-game-component-macros = { path = "../game-component-macros" }
engine-game-macros = { path = "../game-macros" }
engine-game-system-macros = { path = "../game-system-macros" }
wgpu = "29"
winit = "0.30"
glam = "0.29"
bytemuck = { version = "1.16", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
hashbrown = "0.14"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tobj = { version = "4", default-features = false }
gltf = "1"
egui = "0.34"
egui-wgpu = "0.34.3"
rhai = { version = "1", features = ["sync"] }
inventory = "0.3"
# Rapier owns gameplay collision/dynamics and the isolated secondary-motion
# solver on every runtime target (ADR 0096, ADR 0112). Keep default features
# disabled so the dimensionality/scalar contract is explicit and stable.
rapier3d = { version = "0.35.1", default-features = false, features = ["dim3", "f32", "std"] }

[features]
default = ["fbx-import", "mmd-import"]
# Import implementations live in engine-import; the facade forwards feature
# selection so existing `engine` consumers keep the same public feature API.
fbx-import = ["engine-import/fbx-import"]
mmd-import = ["engine-import/mmd-import"]
# Transitional non-default feature retaining the existing lockfile dependency
# set while platform backend ownership moves fully into engine-platform. Normal
# runtime/editor builds never enable these duplicate direct dependencies.
legacy-direct-platform-backends = ["dep:gilrs", "dep:rodio"]

[dev-dependencies]
engine-animation = { path = "../animation", features = ["test-fixtures"] }
engine-import = { path = "../import", default-features = false, features = ["test-fixtures"] }
tempfile = "3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native egui integration uses the operating-system clipboard through
# egui-winit's default `clipboard` feature. The dependency is target-scoped so
# arboard can never enter the wasm32 dependency graph.
egui-winit = "0.34.3"
pollster = "0.3"
env_logger = "0.11"
libloading = "0.8"
dirs = "5"
gilrs = { version = "0.11", optional = true }
rodio = { version = "0.20", default-features = false, features = ["wav", "vorbis"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Web clipboard access has browser-specific asynchronous permission and event
# semantics. Keep egui-winit's native clipboard backend disabled; the browser
# integration owns ClipboardEvent / Navigator.clipboard handling instead.
egui-winit = { version = "0.34.3", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement"] }
console_error_panic_hook = "0.1"
console_log = "1"
getrandom = { version = "0.3", features = ["wasm_js"] }
