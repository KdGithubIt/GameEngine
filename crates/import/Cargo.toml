[package]
name = "engine-import"
version = "0.1.0"
edition = "2024"

[dependencies]
engine-animation = { path = "../animation", default-features = false }
engine-authoring = { path = "../authoring" }
engine-assets = { path = "../assets" }
engine-render-runtime = { path = "../render-runtime", default-features = false }
engine-rig = { path = "../rig" }
glam = "0.29"
hashbrown = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
gltf = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["fbx-import", "mmd-import"]
fbx-import = ["dep:ufbx"]
mmd-import = ["dep:mmd-anim-format", "dep:mmd-anim-runtime"]
test-fixtures = []

[dev-dependencies]
engine-ecs = { path = "../ecs" }
tempfile = "3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ufbx = { version = "0.11", optional = true }
mmd-anim-format = { version = "0.4", optional = true }
mmd-anim-runtime = { version = "0.4", optional = true }
