[package]
name = "engine-scene"
version = "0.1.0"
edition = "2024"

[dependencies]
engine-authoring = { path = "../authoring" }
engine-ecs = { path = "../ecs" }
engine-platform = { path = "../platform", default-features = false }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "5"
