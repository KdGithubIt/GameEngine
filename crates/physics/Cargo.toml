[package]
name = "engine-physics"
version = "0.1.0"
edition = "2024"

[dependencies]
engine-core = { path = "../core" }
engine-ecs = { path = "../ecs" }
engine-rig = { path = "../rig" }
glam = "0.29"
hashbrown = "0.14"
rapier3d = { version = "0.35.1", default-features = false, features = ["dim3", "f32", "std"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["solver"]
solver = ["dep:rapier3d"]
